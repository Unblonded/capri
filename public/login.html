<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='n' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%231f2a52'/><stop offset='1' stop-color='%230a0f22'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23n)'/><g transform='translate(4.6 4.2) scale(0.95)' fill='none' stroke='%23e9c46a' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'><path d='M3.6 8.2c1.3-1.3 3.3-.6 3.3 1.6V17.5'/><path d='M6.9 10.6c0-2.9 1.7-4.6 3.8-4.6 2.2 0 3.6 1.6 3.6 4.1v5.4'/><path d='M14.3 15.5a2.75 2.75 0 1 0 2.75-2.75c-1.6 0-2.75 1.3-2.75 2.9 0 2.9-2 4.9-4.7 5.4'/></g></svg>" />
  <script>
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('tdp:theme')) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { /* default theme */ }
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>
  <div class="connect">
    <div class="connect-card glass">
      <div class="brand big">
        <span class="logo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 8.2c1.3-1.3 3.3-.6 3.3 1.6V17.5"/><path d="M6.9 10.6c0-2.9 1.7-4.6 3.8-4.6 2.2 0 3.6 1.6 3.6 4.1v5.4"/><path d="M14.3 15.5a2.75 2.75 0 1 0 2.75-2.75c-1.6 0-2.75 1.3-2.75 2.9 0 2.9-2 4.9-4.7 5.4"/></svg></span>
        <span class="wordmark">Capri</span>
      </div>
      <p class="muted">This Capri server is password protected.</p>
      <form id="login">
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus />
        <button class="btn primary wide" type="submit">Unlock</button>
      </form>
      <p id="err" class="error"></p>
    </div>
  </div>
  <script>
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }),
      });
      if (res.ok) location.replace('/');
      else err.textContent = (await res.json().catch(() => ({}))).error || 'Could not unlock';
    });
  </script>
</body>
</html>
