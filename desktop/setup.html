<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>Capri</title>
  <style>
    :root { --bg: #ece8df; --card: rgba(255,255,255,.55); --line: rgba(255,255,255,.75); --text: #161a2b; --muted: #5f6070; --accent: #a87414; --accent-2: #d7a443; --err: #e5383b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #060914; --card: rgba(26,32,60,.6); --line: rgba(255,255,255,.12); --text: #eef0f8; --muted: #a2a8c2; --accent: #e6b85c; --accent-2: #f6dc96; --err: #ff6b6b; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI Variable", "Segoe UI", -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text);
      display: grid; place-items: center; overflow: hidden; -webkit-app-region: drag;
    }
    .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .55; }
    .b1 { width: 50vw; height: 50vw; background: #b7cdb0; top: -15vw; left: -10vw; }
    .b2 { width: 45vw; height: 45vw; background: #a8bcd8; bottom: -15vw; right: -10vw; }
    @media (prefers-color-scheme: dark) { .b1 { background: #22337a; } .b2 { background: #0f5363; } .blob { opacity: .4; } }
    .card {
      position: relative; width: min(420px, calc(100vw - 32px)); padding: 32px; border-radius: 26px; text-align: center;
      background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(28px) saturate(180%);
      box-shadow: 0 20px 60px rgba(0,0,0,.25), inset 0 1px 0 var(--line); -webkit-app-region: no-drag;
    }
    .logo {
      width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 16px; display: grid; place-items: center; color: #f0cd7c;
      background: linear-gradient(135deg, #1f2a52, #0a0f22); box-shadow: 0 8px 22px rgba(10,15,34,.35), inset 0 0 0 1px rgba(233,196,106,.2);
    }
    h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.02em; }
    p { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.45; }
    form { display: grid; gap: 10px; }
    input {
      font: inherit; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(127,127,127,.08);
      color: var(--text); outline: none; text-align: center;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(215,164,67,.22); }
    button {
      font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 999px; color: #1c1606; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: var(--err); font-size: 13px; min-height: 1.2em; margin: 12px 0 0; }
    .hint { font-size: 12px; margin: 14px 0 0; }
  </style>
</head>
<body>
  <span class="blob b1"></span><span class="blob b2"></span>
  <div class="card">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 8.2c1.3-1.3 3.3-.6 3.3 1.6V17.5"/><path d="M6.9 10.6c0-2.9 1.7-4.6 3.8-4.6 2.2 0 3.6 1.6 3.6 4.1v5.4"/><path d="M14.3 15.5a2.75 2.75 0 1 0 2.75-2.75c-1.6 0-2.75 1.3-2.75 2.9 0 2.9-2 4.9-4.7 5.4"/></svg>
    </div>
    <h1>Capri</h1>
    <p>Enter your Capri server's address,<br />e.g. <b>capri.kalculator.lol</b> or <b>192.168.1.50:3000</b></p>
    <form id="f">
      <input id="url" placeholder="capri.kalculator.lol" autofocus spellcheck="false" />
      <button id="go" type="submit">Connect</button>
    </form>
    <div class="err" id="err"></div>
    <p class="hint">You can change this later from the Capri icon in the system tray.</p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const input = document.getElementById('url');
    const err = document.getElementById('err');
    input.value = (params.get('url') || '').replace(/^https?:\/\//, '');
    err.textContent = params.get('error') || '';
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('go');
      btn.disabled = true;
      btn.textContent = 'Connecting…';
      err.textContent = '';
      const res = await window.capriDesktop.setServer(input.value);
      if (!res.ok) {
        err.textContent = res.error;
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    });
  </script>
</body>
</html>
